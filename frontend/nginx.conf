# Esquema real de la conexión del visitante. Si hay un proxy delante (un túnel, un balanceador) que ya termina el HTTPS, él manda
# X-Forwarded-Proto: https y este nginx solo ve HTTP; sin esto la API creería que la conexión no es segura y la cookie de sesión
# saldría sin la marca Secure. Sin proxy exterior se usa el esquema que ve este nginx.
map $http_x_forwarded_proto $esquema_del_visitante {
  default $scheme;
  https   https;
}

# HSTS solo por HTTPS: sobre HTTP los navegadores lo ignoran y, mal puesto, bloquearía el sitio si luego se pierde el certificado.
map $esquema_del_visitante $hsts {
  default "";
  https   "max-age=31536000";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fotos de galería: hasta varias imágenes de 5 MB por petición.
  client_max_body_size 50m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # El DNS interno de Docker (127.0.0.11) se consulta en cada petición (con la dirección guardada 10 s) y no solo al arrancar:
  # si el backend se recrea y cambia de IP, nginx lo sigue sin reiniciarse. Con "proxy_pass http://backend:4000" a secas, la
  # dirección se resuelve una única vez y, al cambiar, todo da 502 hasta reiniciar este contenedor.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;

  # API, fotos subidas y comprobación de salud: van al backend (red interna de Docker).
  location ~ ^/(api|uploads)/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_del_visitante;
  }
  location = /salud {
    proxy_pass $backend;
  }

  # Archivos compilados por Vite: llevan el hash en el nombre, se pueden guardar un año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/nginx-seguridad.conf;
  }

  # Aplicación de una sola página: cualquier ruta del navegador carga index.html (sin guardarlo en caché).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/nginx-seguridad.conf;
  }
}
