# Cabeceras de seguridad de las páginas y archivos estáticos. Se incluye en cada bloque `location` que usa add_header, porque nginx
# NO hereda las cabeceras del servidor cuando un bloque define las suyas. Las respuestas de /api y /uploads ya traen las de helmet.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;
# Solo se envía cuando el visitante llegó por HTTPS (valor vacío = nginx no manda la cabecera). Ver el map en nginx.conf.
add_header Strict-Transport-Security $hsts always;
# Qué puede cargar la página: scripts solo propios; estilos con 'unsafe-inline' porque React y Leaflet ponen estilos en línea;
# fuentes de Google; mapas de OpenStreetMap y Esri; fotos propias, de datos/blob y por https (imágenes del catálogo).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
