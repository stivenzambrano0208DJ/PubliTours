# PubliTours para Dokploy (u otro panel con proxy Traefik delante). Diferencias con docker-compose.yml:
#  - La base de datos NO está aquí: es un servicio "Database" (PostgreSQL) de Dokploy, con sus propios respaldos y su propio
#    ciclo de vida. El backend la alcanza por la red "dokploy-network" usando DB_HOST (el nombre interno que muestra el panel).
#  - No publica puertos en el servidor: Dokploy enruta el dominio al servicio "frontend" (puerto 80) y pone el HTTPS.
#  - TRUST_PROXY=2: hay DOS proxies delante del backend (Traefik y el nginx del frontend). Con 1, todos los visitantes
#    parecerían tener la IP de Traefik y compartirían un único límite de intentos de acceso.
# Las variables (secretos incluidos) se definen en el panel de Dokploy, nunca en el repositorio.

name: publitours

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: ${TRUST_PROXY:-2} # Traefik + nginx delante: la IP real llega en X-Forwarded-For
      DB_HOST: ${DB_HOST:?Define DB_HOST (nombre interno de la base de datos de Dokploy)}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-publitours}
      DB_USER: ${DB_USER:-publitours_app}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Define CORS_ORIGIN en el archivo .env}
      FRONTEND_URL: ${CORS_ORIGIN}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMISION_PORCENTAJE: ${COMISION_PORCENTAJE:-10}
    volumes:
      - uploads:/app/public/uploads
    networks:
      - default
      - dokploy-network # para llegar a la base de datos de Dokploy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

volumes:
  uploads:

networks:
  dokploy-network:
    external: true
